[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdcguard"
version = "0.4.0"
description = "Catch GPUs that give wrong answers without crashing, in PyTorch training and vLLM serving."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hari Krishna Kancharla" }]
keywords = ["pytorch", "vllm", "gpu", "cuda", "silent data corruption", "sdc", "abft", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = ["torch>=2.8"]

[project.urls]
Homepage = "https://github.com/hari-kancharla/sdcguard"
Board = "https://hari-kancharla.github.io/sdcguard/board/"
Issues = "https://github.com/hari-kancharla/sdcguard/issues"

[project.optional-dependencies]
certify = ["cryptography>=42"]
metrics = ["prometheus-client>=0.20"]
nvsentinel = ["grpcio>=1.60"]
all = ["cryptography>=42", "prometheus-client>=0.20", "grpcio>=1.60"]
experiments = ["numpy", "matplotlib", "tiktoken"]
dev = ["pytest", "cryptography>=42", "prometheus-client>=0.20", "grpcio>=1.60"]

[project.scripts]
sdcguard = "sdcguard.cli:main"

[project.entry-points."vllm.general_plugins"]
sdcguard = "sdcguard.vllm_plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
