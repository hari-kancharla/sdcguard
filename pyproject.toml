[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdcguard"
version = "0.4.0"
description = "Check how much of each request's prompt vLLM's KV-transfer checksum actually compared, from saved prefill/decode recordings."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{ name = "Hari Krishna Kancharla" }]
keywords = ["vllm", "kv-cache", "kv-transfer", "checksum", "prefix-caching", "prefill-decode", "nixl", "pytorch", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = ["torch>=2.8"]

[project.urls]
Homepage = "https://github.com/hari-kancharla/sdcguard"
Board = "https://hari-kancharla.github.io/sdcguard/board/"
Issues = "https://github.com/hari-kancharla/sdcguard/issues"

[project.optional-dependencies]
certify = ["cryptography>=42"]
metrics = ["prometheus-client>=0.20"]
nvsentinel = ["grpcio>=1.60"]
all = ["cryptography>=42", "prometheus-client>=0.20", "grpcio>=1.60"]
experiments = ["numpy", "matplotlib", "tiktoken"]
# pytest 9.2 undoes monkeypatched torch settings (torch.backends.cuda.matmul, Inductor config) by deleting them
dev = ["pytest<9.2", "cryptography>=42", "prometheus-client>=0.20", "grpcio>=1.60"]

[project.scripts]
sdcguard = "sdcguard.cli:main"

[project.entry-points."vllm.general_plugins"]
sdcguard = "sdcguard.vllm_plugin:register"
sdcguard_coverage = "sdcguard.native_operator.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdcguard = ["case_data/*.json", "case_data/61229/*", "case_data/engine_generation/*",
            "operator_data/*", "operator_data/guides/*", "operator_data/profiles/*"]
"sdcguard.native_operator" = ["profile_data/artifacts/*.json", "profile_data/builds/*/artifacts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
