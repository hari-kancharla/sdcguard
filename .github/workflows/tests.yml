# Runs the test suite on every push and pull request (CPU only: the GPU tests run on Modal, see scripts/).
# publish.yml runs it too, before a release is uploaded.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (CPU PyTorch, plus Triton so its CPU interpreter tests the GPU kernels)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,experiments]" triton==3.8.0 transformers==5.20.1 accelerate==1.15.0
      - name: Tests
        run: python -m pytest -q -rs tests
  # The oldest Python and PyTorch the package says it supports (pyproject.toml and the README: Python 3.10+,
  # PyTorch 2.8+), next to the versions above. No Triton here: its interpreter tests run in the job above.
  cpu-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # (Inductor's C++ build imports setuptools, which torch 2.8 requires only on Python 3.12 and later)
      - name: Install (the oldest supported CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,experiments]" setuptools
      - name: Tests
        run: python -m pytest -q -rs tests
