# Builds sdcguard and uploads it to PyPI when a version tag (like v0.3.0) is pushed, once the test suite has
# passed on the tagged commit and that commit is on main.
# Uses PyPI trusted publishing, so no API token is stored anywhere.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  on-main:
    runs-on: ubuntu-latest
    steps:
      # every branch's history, main included (the token isn't kept after this step)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which isn't on main"; exit 1
          fi
  build:
    needs: [tests, on-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the version in pyproject.toml
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "tag is $GITHUB_REF_NAME but pyproject.toml says $v"; exit 1; fi
      # PyPI can't follow the README's relative links, so point them at this tag on GitHub. While the repo is
      # private, PyPI can't load images from it either, so the PyPI page goes without them.
      - name: README for PyPI
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          python - <<'EOF'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"]
          repo = "https://github.com/hari-kancharla/sdcguard"
          raw = f"https://raw.githubusercontent.com/hari-kancharla/sdcguard/{tag}/"
          s = open("README.md").read()
          if os.environ.get("PRIVATE") == "true":
              s = re.sub(r"<picture>.*?</picture>\n+", "", s, flags=re.S)
              s = re.sub(r"<img [^>]*>\n+", "", s)
              s = re.sub(r"\s*Here's what it looks like on 4 H100s:", "", s)
          s = re.sub(r'(src|srcset)="(?!https?:)([^"]+)"', lambda m: f'{m[1]}="{raw}{m[2]}"', s)
          s = re.sub(r'\]\((?!https?:|#)([^)]+)\)', lambda m: f"]({repo}/blob/{tag}/{m[1]})", s)
          open("README.md", "w").write(s)
          EOF
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sdcguard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
